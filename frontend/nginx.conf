server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache the app shell so a redeploy is picked up immediately;
  # hashed JS/CSS chunks are safe to cache aggressively.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Backend-for-frontend: the only place this container talks to the 42 API
  # is through this proxy - the browser only ever calls same-origin /api/*.
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Angular client-side routing fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
